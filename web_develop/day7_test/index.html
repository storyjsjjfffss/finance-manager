<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>极简财务管家</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .input-group { margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; }
        input { padding: 8px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        li { margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between;}
        .delete-btn { background: #dc3545; padding: 4px 8px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>💰 极简财务管家</h1>

    <!-- 输入区域 -->
    <div class="input-group">
        <input type="number" id="amount" placeholder="金额 (如 50)">
        <input type="text" id="category" placeholder="分类 (如 餐饮)">
        <button onclick="addTransaction()">记一笔</button>
    </div>

    <!-- 账单列表展示区域 -->
    <h3>历史账单</h3>
    <ul id="transactionList">
        <!-- 这里的数据将由 JavaScript 自动生成 -->
    </ul>
    <hr>
    <h3>财务报表</h3>
    <button onclick="fetchReport()">生成分类报表</button>
    <div id="reportContainer" style="margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 5px;">
        点击按钮查看报表...
    </div>

    <script>
        // 你 Python 服务器的地址
        const API_BASE_URL = "http://127.0.0.1:8000";

        // 页面一打开，就自动去后端拉取数据
        window.onload = fetchTransactions;

        // 【查】从 Python 后端获取账单 (GET 请求)
        async function fetchTransactions() {
            const response = await fetch(`${API_BASE_URL}/transactions`);//等价 GET http://127.0.0.1:8000/transactions
            //"等价GET http://127.0.0.1:8000/transactions"
            const data = await response.json();//把服务器返回的 JSON 数据解析成 JavaScript 数据，data是JavaScript 数组

            const listElement = document.getElementById("transactionList");//listElement就代表这个 <ul>
            listElement.innerHTML = ""; // 清空列表

            // 遍历后端传来的 JSON 数据，在网页上画出 <li> 标签
            data.forEach(t => { //把 data 数组里的每一条账单依次拿出来处理。
                const li = document.createElement("li");
                li.innerHTML = `
                    <span>[${t.t_type}] ${t.category}: ¥${t.amount.toFixed(2)}</span>
                    <button class="delete-btn" onclick="deleteTransaction(${t.id})">删除</button>
                `;
                listElement.appendChild(li);
            });
        }

        // 【增】向 Python 后端发送新账单 (POST 请求)
        async function addTransaction() {
            const amount = document.getElementById("amount").value;//从输入框拿数据。
            const category = document.getElementById("category").value;//input.value 得到的是字符串

            if (!amount || !category) {
                alert("金额和分类不能为空！");
                return;
            }

            // 打包成 JSON 格式发给后端
            await fetch(`${API_BASE_URL}/transactions`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },//根据这句话，所以 FastAPI 才能按照 JSON 请求体来解析。
                body: JSON.stringify({//原本 JavaScript 对象->变成 JSON 字符串：
                    amount: parseFloat(amount),
                    category: category,
                    t_type: "支出"
                })
            });

            // 清空输入框并刷新列表
            document.getElementById("amount").value = "";
            document.getElementById("category").value = "";
            fetchTransactions();
        }

        // 【删】通知 Python 后端删除账单 (DELETE 请求)
        async function deleteTransaction(id) {
            await fetch(`${API_BASE_URL}/transactions/${id}`, { method: "DELETE" });
            fetchTransactions(); // 刷新列表
        }

        async  function fetchReport(){
            const response = await fetch(`${API_BASE_URL}/transactions/report`);
            const result = await response.json();
            const container = document.getElementById("reportContainer");
            let htmlContent = `<strong>${result.report_type}</strong><br>`;
            const expenseData  = result.data;
            for (let category in expenseData){
                htmlContent += `🔹 ${category}: ¥${expenseData[category].toFixed(2)} <br>`;
            }

            container.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
